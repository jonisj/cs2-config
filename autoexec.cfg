// CS2 AutoExec - Main config
// Load custom crosshair, color cycler, and viewmodel configs on startup

// Settings
fps_max "460"
sensitivity 2.1
cl_debounce_zoom 0
r_fullscreen_gamma 2
cl_teamid_overhead_fade_near_crosshair 1
cl_showloadout 1

// Safezones
safezoney .99
safezonex .91

// Radar & HUD
hud_scaling .9
cl_hud_radar_scale 1.4
cl_hud_radar_background_alpha 0
cl_hud_radar_map_additive 0
cl_hud_radar_blur_background 0
cl_radar_scale .38
cl_radar_scale_alternate 1
cl_radar_square_always 0
cl_radar_scale_dynamic 0

// Grenade crosshair
cl_grenadecrosshair_smoke 1
cl_grenadecrosshair_explosive 1
cl_grenadecrosshair_flash 1
cl_grenadecrosshair_fire 1
cl_grenadecrosshairdelay_smoke .5
cl_grenadecrosshairdelay_explosive 1
cl_grenadecrosshairdelay_flash .5
cl_grenadecrosshairdelay_fire .5

cl_crosshair_friendly_warning 0

// Execs
exec custom/crosshair-cycler.cfg
exec custom/crosshair-color-cycler.cfg
exec custom/viewmodel-cycler.cfg

// Binds
bind "W" "+forward"
bind "A" "+left"
bind "S" "+back"
bind "D" "+right"
bind "space" "+jump"
bind "ALT" "+jump;"
bind "N" "+jump"
bind "F2" "noclip; vote option2"
bind "F1" "incrementvar volume 0.03 0.65 0.3; vote option1"
bind "capslock" "toggleradarscale; css_throw"

bind "MOUSE5"     "css_timer"
bind "MOUSE1"     "+attack"
bind "MOUSE2"     "+attack2"
bind "MOUSE3"	  "+voicerecord"
bind "MOUSE4"     "+turnleft"
bind "MWHEELDOWN" "+jump"
bind "MWHEELUP"   "+jump"

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot6"
bind "5" "slot5"
bind "6" "slot9"
bind "F" "slot7"
bind "V" "slot10"
bind "C" "slot8"
bind "Z" "slot12;css_clear"

bind "RIGHTARROW" 	"buy smokegrenade"
bind "DOWNARROW" 	"buy flashbang"
bind "LEFTARROW" 	"buy hegrenade"
bind "DEL"			"buy molotov; buy incgrenade;"
bind "END" 			"buy defuser"

bind "F9" "disconnect"
bind "X" "player_ping"
bind "Q" "lastinv"
bind "T" "+lookatweapon"
bind "H" "+spray_menu"
bind "F3" "switchhands"

unbind .
bind "," say_team "oden: kanna, ammu pähän ja anna inffo + ole leaderi. muut ei siihen pysty se olet sinä. T oneAheadshot"

alias "+hedyllapaaha" "+attack;cl_crosshair_recoil 1"
alias "-hedyllapaaha" "-attack;cl_crosshair_recoil 0"
// bind "mouse1" "+hedyllapaaha"