// Viewmodel Cycler Config
// Provides preset viewmodel positions with keybinding to cycle through them

// Positions
alias "vm_preset1"	"viewmodel_presetpos 1; alias vm_cycler vm_preset2"
alias "vm_preset2"	"viewmodel_presetpos 2; alias vm_cycler vm_gangsta"
alias "vm_gangsta"	"viewmodel_offset_x 2.5; viewmodel_offset_y -1; viewmodel_offset_z 2; alias vm_cycler vm_butt"
alias "vm_butt"		"viewmodel_offset_x -2; viewmodel_offset_y -2; viewmodel_offset_z 2; alias vm_cycler vm_doom"
alias "vm_doom"		"viewmodel_offset_x -2; viewmodel_offset_y -2; viewmodel_offset_z -1.5; alias vm_cycler vm_preset1_low"
alias "vm_preset1_low" "viewmodel_offset_x 2.5; viewmodel_offset_y 2; viewmodel_offset_z -2; alias vm_cycler vm_preset1"

// Default viewmodel on load
vm_preset1

// Show current viewmodel offsets in console
alias "vm" "viewmodel_offset_x; viewmodel_offset_y; viewmodel_offset_z"

// Bind '[' to cycle through presets
bind "[" "vm_cycler; play player/geiger1" // Å
