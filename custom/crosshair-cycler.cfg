// Crosshair Cycler Config
// Preset crosshairs with a keybinding to cycle them

// New values
// cl_crosshair_length 0-255
// cl_crosshair_thickness0-31
// cl_crosshair_gap 0-128
// cl_crosshair_drawoutline 0-2 
//		0 off
//		1 outline
//		2 half outline
// cl_crosshairstyle 
//		1 dynamic circle
//		2 dynamic cross (classic)
//		3 static circle
//		4 static cross
//		5 dynamic cross (legacy / shot feedback)
//		6 dot only
//		7 dynamic quad
//		8 static square


// Preset A
alias "ch_a_size"				"cl_crosshair_length 7"
alias "ch_a_thickness"			"cl_crosshair_thickness 2"
alias "ch_a_gap"				"cl_crosshair_gap 4"
alias "ch_a_outline"			"cl_crosshair_drawoutline 2"
alias "ch_a_style"				"cl_crosshairstyle 4"
alias "ch_a_dot"				"cl_crosshairdot 0"
alias "ch_a_t"					"cl_crosshair_t 0"
alias "ch_a_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_a"			"ch_a_size; ch_a_thickness; ch_a_gap; ch_a_outline; ch_a_style; ch_a_dot; ch_a_alpha; ch_a_t; ch_a_recoil; alias ch_reset_crosshair ch_set_style_a; alias ch_cycler ch_set_style_b; echo CROSSHAIR: A"

// Preset B
alias "ch_b_size"				"cl_crosshair_length 6"
alias "ch_b_thickness"			"cl_crosshair_thickness 2"
alias "ch_b_gap"				"cl_crosshair_gap 0"
alias "ch_b_outline"			"cl_crosshair_drawoutline 1"
alias "ch_b_style"				"cl_crosshairstyle 4"
alias "ch_b_dot"				"cl_crosshairdot 0"
alias "ch_b_t"					"cl_crosshair_t 0"
alias "ch_b_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_b"			"ch_b_size; ch_b_thickness; ch_b_gap; ch_b_outline; ch_b_style; ch_b_dot; ch_b_alpha; ch_b_t; ch_b_recoil; alias ch_reset_crosshair ch_set_style_b; alias ch_cycler ch_set_style_c; echo CROSSHAIR: B"

// Preset C
alias "ch_c_size"				"cl_crosshair_length 5"
alias "ch_c_thickness"			"cl_crosshair_thickness 4"
alias "ch_c_gap"				"cl_crosshair_gap 0"
alias "ch_c_outline"			"cl_crosshair_drawoutline 1"
alias "ch_c_style"				"cl_crosshairstyle 6"
alias "ch_c_dot"				"cl_crosshairdot 1"
alias "ch_c_t"					"cl_crosshair_t 0"
alias "ch_c_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_c"			"ch_c_size; ch_c_thickness; ch_c_gap; ch_c_outline; ch_c_style; ch_c_dot; ch_c_alpha; ch_c_t; ch_c_recoil; alias ch_reset_crosshair ch_set_style_c; alias ch_cycler ch_set_style_d; echo CROSSHAIR: C"

// Preset D
alias "ch_d_size"				"cl_crosshair_length 3"
alias "ch_d_thickness"			"cl_crosshair_thickness 3"
alias "ch_d_gap"				"cl_crosshair_gap 5"
alias "ch_d_outline"			"cl_crosshair_drawoutline 1"
alias "ch_d_style"				"cl_crosshairstyle 3"
alias "ch_d_dot"				"cl_crosshairdot 0"
alias "ch_d_t"					"cl_crosshair_t 0"
alias "ch_d_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_d"			"ch_d_size; ch_d_thickness; ch_d_gap; ch_d_outline; ch_d_style; ch_d_dot; ch_d_alpha; ch_d_t; ch_d_recoil; alias ch_reset_crosshair ch_set_style_d; alias ch_cycler ch_set_style_e; echo CROSSHAIR: D"

// Preset E Circle
alias "ch_e_size"				"cl_crosshair_length 3"
alias "ch_e_thickness"			"cl_crosshair_thickness 3"
alias "ch_e_gap"				"cl_crosshair_gap 5"
alias "ch_e_outline"			"cl_crosshair_drawoutline 0"
alias "ch_e_style"				"cl_crosshairstyle 3"
alias "ch_e_dot"				"cl_crosshairdot 0"
alias "ch_e_t"					"cl_crosshair_t 0"
alias "ch_e_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_e"			"ch_e_size; ch_e_thickness; ch_e_gap; ch_e_outline; ch_e_style; ch_e_dot; ch_e_alpha; ch_e_t; ch_e_recoil; alias ch_reset_crosshair ch_set_style_e; alias ch_cycler ch_set_style_f; echo CROSSHAIR: E"

// Preset F
alias "ch_f_size"				"cl_crosshair_length 6"
alias "ch_f_thickness"			"cl_crosshair_thickness 1"
alias "ch_f_gap"				"cl_crosshair_gap 1"
alias "ch_f_outline"			"cl_crosshair_drawoutline 0"
alias "ch_f_style"				"cl_crosshairstyle 4"
alias "ch_f_dot"				"cl_crosshairdot 0"
alias "ch_f_t"					"cl_crosshair_t 0"
alias "ch_f_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_f"			"ch_f_size; ch_f_thickness; ch_f_gap; ch_f_outline; ch_f_style; ch_f_dot; ch_f_alpha; ch_f_t; ch_f_recoil; alias ch_reset_crosshair ch_set_style_f; alias ch_cycler ch_set_style_g; echo CROSSHAIR: F"

// Preset G
alias "ch_g_size"				"cl_crosshair_length 5"
alias "ch_g_thickness"			"cl_crosshair_thickness 2"
alias "ch_g_gap"				"cl_crosshair_gap 4"
alias "ch_g_outline"			"cl_crosshair_drawoutline 1"
alias "ch_g_style"				"cl_crosshairstyle 4"
alias "ch_g_dot"				"cl_crosshairdot 0"
alias "ch_g_t"					"cl_crosshair_t 0"
alias "ch_g_recoil"			    "cl_crosshair_recoil 0"
alias "ch_set_style_g"			"ch_g_size; ch_g_thickness; ch_g_gap; ch_g_outline; ch_g_style; ch_g_dot; ch_g_alpha; ch_g_t; ch_g_recoil; alias ch_reset_crosshair ch_set_style_g; alias ch_cycler ch_set_style_a; echo CROSSHAIR: G"

// Set default crosshair
ch_set_style_c

// Bind 'P' to cycle through presets
bind "p" "ch_cycler; play ui/buttonclick"

// Print out current crosshair settings to console
alias "ch" "cl_crosshair_length;cl_crosshair_thickness;cl_crosshair_gap;cl_crosshair_drawoutline;cl_crosshairstyle;cl_crosshairdot;cl_crosshair_t;cl_crosshair_recoil"
