// Crosshair Cycler Config
// Provides preset crosshairs with keybinding to cycle between them

// Preset A - Standard Double Line
alias "ch_a_size"				"cl_crosshairsize 2"
alias "ch_a_thickness"			"cl_crosshairthickness .5"
alias "ch_a_gap"				"cl_crosshairgap 0"
alias "ch_a_outline"			"cl_crosshair_drawoutline 1"
alias "ch_a_outlinethickness"	"cl_crosshair_outlinethickness 1"
alias "ch_a_style"				"cl_crosshairstyle 4"
alias "ch_a_dot"				"cl_crosshairdot 0"
alias "ch_a_alpha"				"cl_crosshairalpha 255"
alias "ch_a_t"					"cl_crosshair_t 0"
alias "ch_a_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_a"			"ch_a_size; ch_a_thickness; ch_a_gap; ch_a_outline; ch_a_outlinethickness; ch_a_style; ch_a_dot; ch_a_alpha; ch_a_t; ch_a_recoil; alias ch_reset_crosshair ch_set_style_a; alias ch_cycler ch_set_style_b; echo CROSSHAIR: A"

// Preset B - Tighter Gap
alias "ch_b_size"				"cl_crosshairsize 1.6"
alias "ch_b_thickness"			"cl_crosshairthickness .5"
alias "ch_b_gap"				"cl_crosshairgap -2"
alias "ch_b_outline"			"cl_crosshair_drawoutline 1"
alias "ch_b_outlinethickness"	"cl_crosshair_outlinethickness .5"
alias "ch_b_style"				"cl_crosshairstyle 4"
alias "ch_b_dot"				"cl_crosshairdot 0"
alias "ch_b_alpha"				"cl_crosshairalpha 255"
alias "ch_b_t"					"cl_crosshair_t 0"
alias "ch_b_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_b"			"ch_b_size; ch_b_thickness; ch_b_gap; ch_b_outline; ch_b_outlinethickness; ch_b_style; ch_b_dot; ch_b_alpha; ch_b_t; ch_b_recoil; alias ch_reset_crosshair ch_set_style_b; alias ch_cycler ch_set_style_c; echo CROSSHAIR: B"

// Preset C - Dot Crosshair (large gap)
alias "ch_c_size"				"cl_crosshairsize 2"
alias "ch_c_thickness"			"cl_crosshairthickness 1"
alias "ch_c_gap"				"cl_crosshairgap 9999"
alias "ch_c_outline"			"cl_crosshair_drawoutline 1"
alias "ch_c_outlinethickness"	"cl_crosshair_outlinethickness 1"
alias "ch_c_style"				"cl_crosshairstyle 4"
alias "ch_c_dot"				"cl_crosshairdot 1"
alias "ch_c_alpha"				"cl_crosshairalpha 255"
alias "ch_c_t"					"cl_crosshair_t 0"
alias "ch_c_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_c"			"ch_c_size; ch_c_thickness; ch_c_gap; ch_c_outline; ch_c_outlinethickness; ch_c_style; ch_c_dot; ch_c_alpha; ch_c_t; ch_c_recoil; alias ch_reset_crosshair ch_set_style_c; alias ch_cycler ch_set_style_d; echo CROSSHAIR: C"

// Preset D - Thin Standard
alias "ch_d_size"				"cl_crosshairsize 2.3"
alias "ch_d_thickness"			"cl_crosshairthickness .1"
alias "ch_d_gap"				"cl_crosshairgap 0"
alias "ch_d_outline"			"cl_crosshair_drawoutline 1"
alias "ch_d_outlinethickness"	"cl_crosshair_outlinethickness 1"
alias "ch_d_style"				"cl_crosshairstyle 4"
alias "ch_d_dot"				"cl_crosshairdot 0"
alias "ch_d_alpha"				"cl_crosshairalpha 255"
alias "ch_d_t"					"cl_crosshair_t 0"
alias "ch_d_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_d"			"ch_d_size; ch_d_thickness; ch_d_gap; ch_d_outline; ch_d_outlinethickness; ch_d_style; ch_d_dot; ch_d_alpha; ch_d_t; ch_d_recoil; alias ch_reset_crosshair ch_set_style_d; alias ch_cycler ch_set_style_e; echo CROSSHAIR: D"

// Preset E - Thick Center (recoil tracking enabled)
alias "ch_e_size"				"cl_crosshairsize 1"
alias "ch_e_thickness"			"cl_crosshairthickness 8"
alias "ch_e_gap"				"cl_crosshairgap -7"
alias "ch_e_outline"			"cl_crosshair_drawoutline 0"
alias "ch_e_outlinethickness"	"cl_crosshair_outlinethickness 3"
alias "ch_e_style"				"cl_crosshairstyle 4"
alias "ch_e_dot"				"cl_crosshairdot 0"
alias "ch_e_alpha"				"cl_crosshairalpha 255"
alias "ch_e_t"					"cl_crosshair_t 0"
alias "ch_e_recoil"			"cl_crosshair_recoil 1"
alias "ch_set_style_e"			"ch_e_size; ch_e_thickness; ch_e_gap; ch_e_outline; ch_e_outlinethickness; ch_e_style; ch_e_dot; ch_e_alpha; ch_e_t; ch_e_recoil; alias ch_reset_crosshair ch_set_style_e; alias ch_cycler ch_set_style_f; echo CROSSHAIR: E"

// Preset F - Tight Minimal (default)
alias "ch_f_size"				"cl_crosshairsize 2.2"
alias "ch_f_thickness"			"cl_crosshairthickness .5"
alias "ch_f_gap"				"cl_crosshairgap -4"
alias "ch_f_outline"			"cl_crosshair_drawoutline 0"
alias "ch_f_outlinethickness"	"cl_crosshair_outlinethickness 1"
alias "ch_f_style"				"cl_crosshairstyle 4"
alias "ch_f_dot"				"cl_crosshairdot 0"
alias "ch_f_alpha"				"cl_crosshairalpha 255"
alias "ch_f_t"					"cl_crosshair_t 0"
alias "ch_f_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_f"			"ch_f_size; ch_f_thickness; ch_f_gap; ch_f_outline; ch_f_outlinethickness; ch_f_style; ch_f_dot; ch_f_alpha; ch_f_t; ch_f_recoil; alias ch_reset_crosshair ch_set_style_f; alias ch_cycler ch_set_style_g; echo CROSSHAIR: F"

// Preset G - Minimal Thin Lines
alias "ch_g_size"				"cl_crosshairsize 1"
alias "ch_g_thickness"			"cl_crosshairthickness 0"
alias "ch_g_gap"				"cl_crosshairgap -4"
alias "ch_g_outline"			"cl_crosshair_drawoutline 0"
alias "ch_g_outlinethickness"	"cl_crosshair_outlinethickness 1"
alias "ch_g_style"				"cl_crosshairstyle 4"
alias "ch_g_dot"				"cl_crosshairdot 0"
alias "ch_g_alpha"				"cl_crosshairalpha 255"
alias "ch_g_t"					"cl_crosshair_t 0"
alias "ch_g_recoil"			"cl_crosshair_recoil 0"
alias "ch_set_style_g"			"ch_g_size; ch_g_thickness; ch_g_gap; ch_g_outline; ch_g_outlinethickness; ch_g_style; ch_g_dot; ch_g_alpha; ch_g_t; ch_g_recoil; alias ch_reset_crosshair ch_set_style_g; alias ch_cycler ch_set_style_a; echo CROSSHAIR: G"

// Set default crosshair on load
ch_set_style_f

// Bind 'P' to cycle through presets
bind "p" "ch_cycler; play ui/buttonclick"

// Debug command - prints current crosshair cvars to console
alias "ch" "cl_crosshairsize;cl_crosshairthickness;cl_crosshairgap;cl_crosshair_drawoutline;cl_crosshair_outlinethickness;cl_crosshairstyle;cl_crosshairdot;cl_crosshairalpha;cl_crosshair_t;cl_crosshair_recoil"

// Crosshair Max Utility (nade alignment tool)
// Temporarily expands crosshair for nade alignment. Toggle with F5.
alias "+crosshairmax_active" "cl_crosshairsize 5000; cl_crosshairthickness .1; cl_crosshairgap -20; cl_crosshair_drawoutline 0; cl_crosshairalpha 255; cl_crosshair_t 0"
alias "-crosshairmax_active" "ch_reset_crosshair"
alias "+crosshairmax_disabled" ""
alias "-crosshairmax_disabled" ""

// Default state: crosshairmax enabled
alias "+crosshairmax" "+crosshairmax_active"
alias "-crosshairmax" "-crosshairmax_active"

// Toggle on/off via F5
alias "toggle_max_enable" "alias +crosshairmax +crosshairmax_active; alias -crosshairmax -crosshairmax_active; alias toggle_max toggle_max_disable; echo CROSSHAIRMAX: enabled (nade alignment active)"
alias "toggle_max_disable" "alias +crosshairmax +crosshairmax_disabled; alias -crosshairmax -crosshairmax_disabled; alias toggle_max toggle_max_enable; echo CROSSHAIRMAX: disabled (no crosshair change on nade binds)"
alias "toggle_max" "toggle_max_disable"

// Bind F5 to toggle crosshairmax behavior
bind "F5" "toggle_max; play player/geiger1"
