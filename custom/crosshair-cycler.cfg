// The Crosshair Cycle
alias "ch_cycle_normal"	"ch_set_style_normal;"
alias "ch_cycle_tiny"	"ch_set_style_tiny; alias ch_reset_crosshair ch_set_style_tiny; alias ch_cycler ch_cycle_dot"
alias "ch_cycle_dot"	"ch_set_style_dot; alias ch_reset_crosshair ch_set_style_dot; alias ch_cycler ch_cycle_thin"
alias "ch_cycle_thin"	"ch_set_style_thin; alias ch_reset_crosshair ch_set_style_thin; alias ch_cycler ch_cycle_square"
alias "ch_cycle_square"	"ch_set_style_square; alias ch_reset_crosshair ch_set_style_square; alias ch_cycler ch_cycle_six"
alias "ch_cycle_six"	"ch_set_style_six; alias ch_reset_crosshair ch_set_style_six; alias ch_cycler ch_cycle_seven"
alias "ch_cycle_seven"	"ch_set_style_seven; alias ch_reset_crosshair ch_set_style_seven; alias ch_cycler ch_cycle_normal"


// Settings:

// Default Crosshair:
ch_cycle_six

// Button to cycle between crosshairs
bind "p" "ch_cycler; play ui/buttonclick"

// Get Crosshair Settings
alias "ch" "cl_crosshairsize;cl_crosshairthickness;cl_crosshairgap;cl_crosshair_drawoutline;cl_crosshair_outlinethickness;cl_crosshairstyle;cl_crosshairdot;cl_crosshairalpha;cl_crosshair_t;cl_crosshair_recoil"

// Crosshair for nade alignment
alias "+crosshairmax" "cl_crosshairsize 5000; cl_crosshairthickness .1; cl_crosshairgap -20; cl_crosshair_drawoutline 0; cl_crosshairalpha 255; cl_crosshair_t 0"
alias "-crosshairmax" "ch_reset_crosshair"